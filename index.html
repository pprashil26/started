 week. Status, lifecycle and Critical highlighting never change their position.</p><p><b>Start time:</b> The stronger HH:mm time in the second row is when that task originally started. Times remain aligned for quick scanning. Day separators make the weekly chronology easier to scan.</p><p><b>Status changes:</b> Responding, resuming, completing or reopening never resets the original start time.</p><p><b>Critical:</b> Pale-red highlighting is independent of task state and never changes Timeline order.</p><p><b>Notes:</b> Add one short plain-text note to a task. A subtle preview stays in the compact row; tap › to expand and ▼ to collapse.</p><p><b>Note chronology:</b> Adding, editing, expanding or copying a note never changes the original start time or Timeline position.</p><p><b>Structured titles:</b> Enter an optional Project and a Task Title. Prefix and Task Title are entered and displayed uppercase and bold with a subtle separator. Copy Title retains the familiar PREFIX: Task title format.</p><p><b>Projects:</b> Use Projects to maintain compact Project Name and Target Month records. Project and Task Title use separate full-width rows in Add/Edit Task for easier mobile entry. Project names, including names with spaces such as CAR REGO, are available through the compact Project selector. Target Month appears subtly in the selector, and manual Project entry remains available. Renaming or deleting a Project never changes existing tasks.</p><p><b>Project filter:</b> Use the compact funnel Project filter in the top toolbar in Started or Not Started. The same session-only selection carries between both views, preserves chronology, and can include managed Projects, manually entered Projects and No Project.</p><p><b>Focus:</b> Use the toolbar Focus control to temporarily show only Active and Responded/Waiting work. Completed and Deferred sessions are hidden until the full Timeline is restored. Focus resets after relaunch.</p><p><b>Continue today:</b> Continue an unfinished
