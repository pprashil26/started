</style></head><body><div class="app"><header class="top"><div class="brand"><img src="icon-192.png" alt=""><span id="brandText">STARTED</span></div><button class="icon-btn" id="addTop" aria-label="Add task">+</button><button class="icon-btn" id="menuBtn" aria-label="Open menu">⋮</button></header><div class="summary"><span><b id="activeCount">0</b>ACTIVE</span><span><b id="doneCount">0</b>COMPLETED</span><span><b id="criticalCount">0</b>CRITICAL</span></div><main class="content" id="timeline"></main><button class="fab" id="fab" aria-label="Add task">+</button><div class="sources">Visual in this file was generated with Microsoft Copilot.</div></div>
<div class="menu hidden" id="menu"><button data-act="collapse">Collapse past weeks</button><button data-act="expand">Expand all weeks</button><button data-act="archive">Archived tasks</button><button data-act="backup">Backup data</button><button data-act="restore">Restore data</button><button data-act="help">Help</button></div><input type="file" id="restoreInput" accept="application/json,.json" class="hidden"><div id="modal"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const DB_NAME='StartedDB',DB_VERSION=1,STORE='tasks',MIRROR='started.recovery.v1',CHANNEL='started-data-sync';
const LIFECYCLES=['Not started','Reviewed','Ready','Responded','Rework','Resolved','Archived'];
let db,tasks=[],archivedMode=false,collapsed=new Set(),editingId=null,bc;
const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function getAll(){return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function putRaw(v){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function deleteRaw(id){return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const normTitle=v=>String(v??'').replace(/[\r\n\t]+/g,' ').replace(/\s+/g,' ').trim();
function validISO(v){return v===null||(typeof v==='string'&&/(Z|[+-]\d\d:\d\d)$/i.test(v)&&Number.isFinite(Date.parse(v)))}
function validate(v){const e=[];const keys=['id','title','startTime','endTime','lifecycle','critical'];if(!v||typeof v!=='object'||Array.isArray(v))return['Task must be an object'];if(Object.keys(v).sort().join('|')!==keys.sort().join('|'))e.push('Task fields do not match V1.0 schema');if(typeof v.id!=='string'||!v.id)e.push('Invalid ID');v.title=normTitle(v.title);if(!v.title||v.title.length>160)e.push('Title must contain 1–160 characters');if(!validISO(v.startTime)||!validISO(v.endTime))e.push('Invalid timestamp');if(v.endTime&&!v.startTime)e.push('End time requires start time');if(v.startTime&&v.endTime&&Date.parse(v.endTime)<Date.parse(v.startTime))e.push('End time cannot precede start time');if(!LIFECYCLES.includes(v.lifecycle))e.push('Invalid lifecycle');if(v.lifecycle==='Not started'&&(v.startTime||v.endTime))e.push('Not started task cannot have timestamps');if(typeof v.critical!=='boolean')e.push('Critical must be true or false');return e}
function localISO(d=new Date()){const z=-d.getTimezoneOffset(),sg=z>=0?'+':'-',p=n=>String(Math.floor(Math.abs(n))).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'.'+String(d.getMilliseconds()).padStart(3,'0')+sg+p(z/60)+':'+p(z%60)}
function inputValue(iso){if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function fromInput(v){if(!v)return null;return localISO(new Date(v))}
async function persist(v){const e=validate(v);if(e.length)throw new Error(e[0]);await putRaw(v);const read=await new Promise((res,rej)=>{const r=tx().get(v.id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(JSON.stringify(read)!==JSON.stringify(v))throw Error('Save verification failed');await refresh();mirror();bc?.postMessage('changed')}
function mirror(){const payload={formatVersion:1,mirroredAt:localISO(),taskCount:tasks.length,tasks};localStorage.setItem(MIRROR,JSON.stringify(payload))}
async function refresh(){tasks=await getAll();render()}
function monday(iso){const d=new Date(iso),day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d}
function weekKey(iso){return monday(iso).toISOString().slice(0,10)}
function sameWeek(iso){return weekKey(iso)===weekKey(localISO())}
function fmtTime(iso){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(iso))}
function fmtDate(iso){return new Intl.DateTimeFormat(undefined,{weekday:'short',day:'numeric',month:'short'}).format(new Date(iso))}
function weekLabel(key){const a=new Date(key+'T00:00:00'),b=new Date(a);b.setDate(a.getDate()+6);if(weekKey(localISO())===key)return'THIS WEEK';const f=d=>d.toLocaleDateString(undefined,{day:'numeric',month:'short'}).toUpperCase();return f(a)+'–'+f(b)}
function duration(a,b){let m=Math.max(0,Math.floor((Date.parse(b)-Date.parse(a))/60000)),d=Math.floor(m/1440);m%=1440;let h=Math.floor(m/60);m%=60;return[d?d+'d':'',h?h+'h':'',(!d&&m)||(!d&&!h)?m+'m':''].filter(Boolean).join(' ')}
function row(t){const active=t.startTime&&!t.endTime,done=t.endTime;let meta=t.lifecycle;if(t.startTime)meta+=' · '+fmtDate(t.startTime)+' '+fmtTime(t.startTime);if(done)meta+=' → '+fmtTime(t.endTime)+' · '+duration(t.startTime,t.endTime);else if(active)meta+=' · ACTIVE';else meta+=' · NOT STARTED';return `<div class="row ${t.critical?'critical':''}" data-id="${t.id}"><button class="state ${done?'done':active?'active':''}" data-quick="${!t.startTime?'start':active?'complete':'reopen'}" title="${!t.startTime?'Start now':active?'Complete now':'Reopen'}">${done?'✓':active?'▶':'○'}</button><div class="row-main" data-edit="1"><div class="title">${esc(t.title)}</div><div class="meta"><span class="${t.lifecycle==='Rework'?'rework':''}">${esc(meta)}</span></div></div>${!t.startTime?'<button class="start-small" data-quick="start">START</button>':''}<button class="more" data-more="1" aria-label="Task actions">⋮</button></div>`}
function section(id,label,arr,isPast=false){const isCollapsed=collapsed.has(id);return `<section class="section ${isCollapsed?'collapsed':''}" data-section="${id}"><button class="section-head" data-toggle="${id}"><span class="chev">${isCollapsed?'›':'▼'}</span>${label}<span class="count">${arr.length}${isCollapsed?' · '+arr.filter(x=>x.endTime).length+' completed':''}</span></button><div class="rows">${arr.map(row).join('')}</div></section>`}
function render(){const visible=tasks.filter(t=>(t.lifecycle==='Archived')===archivedMode);const active=tasks.filter(t=>t.lifecycle!=='Archived'&&t.startTime&&!t.endTime).length,done=tasks.filter(t=>t.lifecycle!=='Archived'&&t.endTime&&sameWeek(t.endTime)).length,crit=tasks.filter(t=>t.lifecycle!=='Archived'&&t.critical).length;$('#activeCount').textContent=active;$('#doneCount').textContent=done;$('#criticalCount').textContent=crit;$('#brandText').textContent=archivedMode?'ARCHIVED':'STARTED';$('#fab').classList.toggle('hidden',archivedMode);$('#addTop').classList.toggle('hidden',archivedMode);const not=visible.filter(t=>!t.startTime).sort(sorter),groups={};visible.filter(t=>t.startTime).forEach(t=>(groups[weekKey(t.startTime)]??=[]).push(t));let out=not.length?section('not','NOT STARTED',not):'';Object.keys(groups).sort().reverse().forEach(k=>out+=section(k,weekLabel(k),groups[k].sort(sorter),k!==weekKey(localISO())));if(!out)out=`<div class="empty">${archivedMode?'No archived tasks.':'Nothing started yet.<br><br><button class="btn primary" data-empty-add>+ Add task</button>'}</div>`;$('#timeline').innerHTML=out}
function sorter(a,b){return Number(b.critical)-Number(a.critical)||(Date.parse(b.startTime||0)-Date.parse(a.startTime||0))||a.title.localeCompare(b.title)}
function showToast(s){const e=$('#toast');e.textContent=s;e.classList.remove('hidden');clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.classList.add('hidden'),1700)}
function closeModal(){$('#modal').innerHTML='';document.body.style.overflow='';editingId=null}
function openEditor(t=null){editingId=t?.id||null;const v=t||{title:'',startTime:null,endTime:null,lifecycle:'Not started',critical:false};$('#modal').innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><h2>${t?'EDIT TASK':'ADD TASK'}</h2><button class="icon-btn" id="closeModal" aria-label="Close">×</button></div><div class="dialog-body"><div class="field"><label>TASK TITLE</label><input id="fTitle" maxlength="160" value="${esc(v.title)}"></div><div class="field"><label>LIFECYCLE</label><select id="fLife">${LIFECYCLES.map(x=>`<option ${x===v.lifecycle?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>START TIME</label><input id="fStart" type="datetime-local" value="${inputValue(v.startTime)}"></div><div class="field"><label>END TIME</label><input id="fEnd" type="datetime-local" value="${inputValue(v.endTime)}" ${v.startTime?'':'disabled'}></div><div class="quick">${!v.startTime?'<button class="btn secondary" id="startNow">Start now</button>':!v.endTime?'<button class="btn secondary" id="completeNow">Complete now</button>':'<button class="btn secondary" id="reopenNow">Reopen</button>'}${t?'<button class="btn secondary" id="copyNow">Copy title</button>':''}</div><label class="check"><input id="fCritical" type="checkbox" ${v.critical?'checked':''}> Critical</label>${t?'<div style="margin-top:16px"><button class="btn danger" id="deleteTask">Delete task</button></div>':''}</div><div class="dialog-foot"><button class="btn secondary" id="cancelModal">Cancel</button><button class="btn primary" id="saveTask">Save</button></div></div></div>`;document.body.style.overflow='hidden';$('#fTitle').focus();$('#closeModal').onclick=$('#cancelModal').onclick=closeModal;$('#startNow')&&($('#startNow').onclick=()=>{$('#fStart').value=inputValue(localISO());if($('#fLife').value==='Not started')$('#fLife').value='Ready';$('#fEnd').disabled=false});$('#completeNow')&&($('#completeNow').onclick=()=>$('#fEnd').value=inputValue(localISO()));$('#reopenNow')&&($('#reopenNow').onclick=()=>$('#fEnd').value='');$('#copyNow')&&($('#copyNow').onclick=()=>copyText(v.title));$('#saveTask').onclick=async()=>{try{let life=$('#fLife').value,start=fromInput($('#fStart').value),end=fromInput($('#fEnd').value);if(life==='Not started'){start=null;end=null}else if(end&&!start)throw Error('End time requires a start time');const obj={id:t?.id||crypto.randomUUID(),title:$('#fTitle').value,startTime:start,endTime:end,lifecycle:life,critical:$('#fCritical').checked};await persist(obj);closeModal();showToast('Saved')}catch(e){showToast(e.message)}};$('#deleteTask')&&($('#deleteTask').onclick=async()=>{if(confirm(`Permanently delete “${v.title}”?`)){await deleteRaw(v.id);await refresh();mirror();closeModal();showToast('Deleted')}})}
async function action(id,a){const t=tasks.find(x=>x.id===id);if(!t)return;const v={...t};if(a==='start'){v.startTime=localISO();if(v.lifecycle==='Not started')v.lifecycle='Ready'}else if(a==='complete'){v.endTime=localISO()}else if(a==='reopen'){v.endTime=null}await persist(v);showToast(a==='start'?'Started':a==='complete'?'Completed':'Reopened')}
async function copyText(s){try{await navigator.clipboard.writeText(s)}catch{const ta=document.createElement('textarea');ta.value=s;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove()}showToast('Copied')}
function taskMenu(t,anchor){const m=$('#menu');m.innerHTML=`<button data-taskact="copy">Copy title</button><button data-taskact="edit">Edit task</button><button data-taskact="${!t.startTime?'start':!t.endTime?'complete':'reopen'}">${!t.startTime?'Start now':!t.endTime?'Complete now':'Reopen'}</button><button data-taskact="archive">${t.lifecycle==='Archived'?'Restore to Ready':'Archive'}</button>`;m.classList.remove('hidden');m.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const a=b.dataset.taskact;m.classList.add('hidden');if(a==='copy')copyText(t.title);else if(a==='edit')openEditor(t);else if(a==='archive'){const v={...t,lifecycle:t.lifecycle==='Archived'?(t.startTime?'Ready':'Not started'):'Archived'};await persist(v);showToast(v.lifecycle==='Archived'?'Archived':'Restored')}else action(t.id,a)})}
$('#timeline').onclick=e=>{const r=e.target.closest('.row');if(e.target.closest('[data-toggle]')){const id=e.target.closest('[data-toggle]').dataset.toggle;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);render()}else if(e.target.closest('[data-empty-add]'))openEditor();else if(r&&e.target.closest('[data-quick]'))action(r.dataset.id,e.target.closest('[data-quick]').dataset.quick);else if(r&&e.target.closest('[data-more]'))taskMenu(tasks.find(x=>x.id===r.dataset.id),e.target);else if(r&&e.target.closest('[data-edit]'))openEditor(tasks.find(x=>x.id===r.dataset.id))};
$('#fab').onclick=$('#addTop').onclick=()=>openEditor();$('#menuBtn').onclick=()=>{const m=$('#menu');m.innerHTML='<button data-act="collapse">Collapse past weeks</button><button data-act="expand">Expand all weeks</button><button data-act="archive">'+(archivedMode?'Back to Timeline':'Archived tasks')+'</button><button data-act="backup">Backup data</button><button data-act="restore">Restore data</button><button data-act="help">Help</button>';m.classList.toggle('hidden');m.querySelectorAll('button').forEach(b=>b.onclick=()=>handleMenu(b.dataset.act))};
async function handleMenu(a){$('#menu').classList.add('hidden');if(a==='collapse'){Object.keys(grouping()).filter(k=>k!==weekKey(localISO())).forEach(k=>collapsed.add(k));render()}else if(a==='expand'){collapsed.clear();render()}else if(a==='archive'){archivedMode=!archivedMode;render()}else if(a==='backup')backup();else if(a==='restore')$('#restoreInput').click();else help()}
function grouping(){const g={};tasks.filter(t=>t.startTime).forEach(t=>g[weekKey(t.startTime)]=1);return g}
async function backup(){const payload={application:'Started',formatVersion:1,databaseVersion:1,exportedAt:localISO(),taskCount:tasks.length,tasks};const raw=JSON.stringify(payload);const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));payload.checksum=[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('');const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='started-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);showToast('Backup created')}
$('#restoreInput').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text()),sum=data.checksum;delete data.checksum;const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(data)));const calc=[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('');if(data.application!=='Started'||data.formatVersion!==1||sum!==calc||!Array.isArray(data.tasks)||data.taskCount!==data.tasks.length)throw Error('Invalid Started backup');const ids=new Set();for(const t of data.tasks){const er=validate(t);if(er.length||ids.has(t.id))throw Error('Backup task validation failed');ids.add(t.id)}if(!confirm(`Replace current data with ${data.tasks.length} tasks?`))return;const tr=db.transaction(STORE,'readwrite'),s=tr.objectStore(STORE);s.clear();data.tasks.forEach(t=>s.put(t));await new Promise((res,rej)=>{tr.oncomplete=res;tr.onerror=()=>rej(tr.error)});await refresh();mirror();showToast('Restore complete')}catch(err){showToast(err.message)}finally{e.target.value=''}};
function help(){$('#modal').innerHTML=`<div class="overlay"><div class="dialog"><div class="dialog-head"><h2>HOW TO USE STARTED</h2><button class="icon-btn" id="closeModal">×</button></div><div class="dialog-body" style="font-size:13px;line-height:1.55"><p><b>Capture only what matters.</b> Add a concise task title, then start it when work begins.</p><p><b>Exact timing.</b> Start and Complete actions capture the current timestamp. You can correct either time in Edit.</p><p><b>Lifecycle is workflow context.</b> Completion is derived from the end timestamp, not the lifecycle.</p><p><b>Weekly review.</b> Tasks are grouped by their start week. Collapse older weeks to focus on the current week.</p><p><b>Critical.</b> Reserve the red highlight for work needing exceptional attention.</p><p><b>Copy title.</b> Use the row menu to copy only the task title.</p></div><div class="dialog-foot"><button class="btn primary" id="cancelModal">Done</button></div></div></div>`;$('#closeModal').onclick=$('#cancelModal').onclick=closeModal}
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('#menuBtn')&&!e.target.closest('[data-more]'))$('#menu').classList.add('hidden')});
(async()=>{try{db=await openDB();tasks=await getAll();bc='BroadcastChannel'in self?new BroadcastChannel(CHANNEL):null;if(bc)bc.onmessage=()=>refresh();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js')}catch(e){console.error(e);const m=localStorage.getItem(MIRROR);if(m){tasks=JSON.parse(m).tasks||[];render();showToast('Recovery mirror loaded')}else showToast('Storage could not be opened')}})();
</script></body></html>
