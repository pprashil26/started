</style></head><body><div class="app"><header class="top"><div class="brand"><img src="icon-192.png" alt=""><span id="brand">STARTED</span></div><button class="icon" id="addTop">+</button><button class="icon" id="menuBtn">⋮</button></header><div class="summary"><span><b id="active">0</b> ACTIVE</span><span><b id="done">0</b> COMPLETED</span><span><b id="crit">0</b> CRITICAL</span></div><main class="content" id="timeline"></main><button class="fab" id="fab">+</button><div class="source">Visual in this file was generated with Microsoft Copilot.</div></div><div id="menu" class="menu hidden"></div><input id="restore" class="hidden" type="file" accept="application/json,.json"><div id="modal"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';const DB='StartedDB',VER=1,STORE='tasks',MIRROR='started.recovery.v1',CH='started-data-sync';const LIFE=['Not started','Reviewed','Ready','Responded','Rework','Resolved','Archived'];let db,tasks=[],archived=false,collapsed=new Set(),bc;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function openDB(){return new Promise((r,j)=>{let q=indexedDB.open(DB,VER);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE,{keyPath:'id'})};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}function store(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}function all(){return new Promise((r,j)=>{let q=store().getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}function rawPut(v){return new Promise((r,j)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v);t.oncomplete=r;t.onerror=()=>j(t.error)})}function rawDelete(id){return new Promise((r,j)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=r;t.onerror=()=>j(t.error)})}
const norm=v=>String(v??'').replace(/[\r\n\t]+/g,' ').replace(/\s+/g,' ').trim();function valid(v){let e=[],keys=['id','title','startTime','endTime','lifecycle','critical'];if(Object.keys(v).sort().join('|')!==keys.sort().join('|'))e.push('Invalid V1 schema');v.title=norm(v.title);if(!v.title||v.title.length>160)e.push('Title must contain 1–160 characters');if(!LIFE.includes(v.lifecycle))e.push('Invalid lifecycle');if(v.lifecycle==='Not started'&&(v.startTime||v.endTime))e.push('Not started cannot have timestamps');if(v.lifecycle==='Responded'&&!v.startTime)e.push('Start the task before setting it to Responded');if(v.endTime&&!v.startTime)e.push('End requires Start');if(v.startTime&&v.endTime&&Date.parse(v.endTime)<Date.parse(v.startTime))e.push('End cannot precede Start');if(typeof v.critical!=='boolean')e.push('Invalid Critical value');return e}
function localISO(d=new Date()){let z=-d.getTimezoneOffset(),sg=z>=0?'+':'-',p=n=>String(Math.floor(Math.abs(n))).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'.'+String(d.getMilliseconds()).padStart(3,'0')+sg+p(z/60)+':'+p(z%60)}function inputVal(x){if(!x)return'';let d=new Date(x),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}function fromInput(x){return x?localISO(new Date(x)):null}async function save(v){let e=valid(v);if(e.length)throw Error(e[0]);await rawPut(v);let read=await new Promise((r,j)=>{let q=store().get(v.id);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});if(JSON.stringify(read)!==JSON.stringify(v))throw Error('Save verification failed');await refresh();mirror();bc?.postMessage('changed')}function mirror(){localStorage.setItem(MIRROR,JSON.stringify({formatVersion:1,mirroredAt:localISO(),taskCount:tasks.length,tasks}))}async function refresh(){tasks=await all();render()}
function monday(x){let d=new Date(x),n=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return d}function week(x){return monday(x).toISOString().slice(0,10)}function sameWeek(x){return week(x)===week(localISO())}function state(t){if(t.endTime!==null)return'completed';if(t.startTime!==null&&t.lifecycle==='Responded')return'responded';if(t.startTime!==null)return'active';return'not-started'}const STATES={'not-started':{symbol:'○',act:'start',label:'Start task'},active:{symbol:'▶',act:'complete',label:'Complete task'},responded:{symbol:'Ⅱ',act:'resume',label:'Task responded and waiting. Return to active'},completed:{symbol:'✓',act:'reopen',label:'Reopen task'}};function time(x){return new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(x))}function startClock(x){let d=new Date(x),p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes())}function localDateKey(x){let d=new Date(x),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}function dayLabel(x,showMonth=false){let d=new Date(x),wd=d.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase(),day=d.getDate();return wd+' '+day+(showMonth?' '+d.toLocaleDateString(undefined,{month:'short'}).toUpperCase():'')}function date(x){return new Intl.DateTimeFormat(undefined,{weekday:'short',day:'numeric',month:'short'}).format(new Date(x))}function dur(a,b){let m=Math.max(0,Math.floor((Date.parse(b)-Date.parse(a))/60000)),h=Math.floor(m/60);m%=60;return(h?h+'h ':'')+m+'m'}function label(k){let a=new Date(k+'T00:00:00'),b=new Date(a);b.setDate(a.getDate()+6);if(k===week(localISO()))return'THIS WEEK';let f=d=>d.toLocaleDateString(undefined,{day:'numeric',month:'short'}).toUpperCase();return f(a)+'–'+f(b)}function sortStartedTasks(a,b){const d=Date.parse(a.startTime)-Date.parse(b.startTime);return d!==0?d:a.id.localeCompare(b.id)}function sortNotStartedTasks(a,b){return a.title.localeCompare(b.title,undefined,{sensitivity function row(t){let s=state(t),c=STATES[s],meta=t.lifecycle;if(s==='completed')meta+=' · '+time(t.endTime)+' · '+dur(t.startTime,t.endTime);else if(s==='responded')meta+=' · WAITING';else if(s==='active')meta+=' · ACTIVE';else meta+=' · NOT STARTED';return `<div class="row ${t.critical?'critical':''}" data-id="${t.id}"><div class="task-time" aria-label="${t.startTime?'Started '+startClock(t.startTime):'Not started'}">${t.startTime?startClock(t.startTime):''}</div><button class="state ${s}" data-quick="${c.act}" aria-label="${c.label}" title="${c.label}">${c.symbol}</button><div class="main" data-edit><div class="title">${esc(t.title)}</div><div class="meta">${esc(meta)}</div></div>${s==='not-started'?'<button class="start" data-quick="start">START</button>':''}<button class="more" data-more>⋮</button></div>`}function chronologicalRows(a){let out='',prev=null,prevMonth=null;for(const t of a){let key=localDateKey(t.startTime),d=new Date(t.startTime),month=d.getFullYear()+'-'+d.getMonth();if(key!==prev){out+=`<div class="day-sep">${dayLabel(t.startTime,prev===null||month!==prevMonth)}</div>`;prev=key;prevMonth=month}out+=row(t)}return out}function section(id,name,a){let c=collapsed.has(id),rows=id==='not'?a.map(row).join(''):chronologicalRows(a);return `<section class="section ${c?'collapsed':''}"><button class="section-head" data-toggle="${id}">${c?'›':'▼'}&nbsp; ${name}<span class="count">${a.length}${c?' · '+a.filter(x=>x.endTime).length+' completed':''}</span></button><div class="rows">${rows}</div></section>`}function render(){let view=tasks.filter(t=>(t.lifecycle==='Archived')===archived);$('#active').textContent=tasks.filter(t=>t.lifecycle!=='Archived'&&t.startTime&&!t.endTime).length;$('#done').textContent=tasks.filter(t=>t.lifecycle!=='Archived'&&t.endTime&&sameWeek(t.endTime)).length;$('#crit').textContent=tasks.filter(t=>t.lifecycle!=='Archived'&&t.critical).length;$('#brand').textContent=archived?'ARCHIVED':'STARTED';$('#fab').classList.toggle('hidden',archived);$('#addTop').classList.toggle('hidden',archived);let not=view.filter(t=>!t.startTime).sort(sortNotStartedTasks),g={};view.filter(t=>t.startTime).forEach(t=>(g[week(t.startTime)]??=[]).push(t));let out=not.length?section('not','NOT STARTED',not):'';Object.keys(g).sort().reverse().forEach(k=>out+=section(k,label(k),g[k].sort(sortStartedTasks)));$('#timeline').innerHTML=out||`<div class="empty">${archived?'No archived tasks.':'Nothing started yet.'}</div>`}
function toast(s){let x=$('#toast');x.textContent=s;x.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.add('hidden'),1600)}function close(){$('#modal').innerHTML='';document.body.style.overflow=''}function editor(t=null){let v=t||{title:'',startTime:null,endTime:null,lifecycle:'Not started',critical:false};$('#modal').innerHTML=`<div class="overlay"><div class="dialog"><div class="dh"><h2>${t?'EDIT TASK':'ADD TASK'}</h2><button class="icon" id="x">×</button></div><div class="db"><div class="field"><label>TASK TITLE</label><input id="title" maxlength="160" value="${esc(v.title)}"></div><div class="field"><label>LIFECYCLE</label><select id="life">${LIFE.map(x=>`<option ${x===v.lifecycle?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>START TIME</label><input id="start" type="datetime-local" value="${inputVal(v.startTime)}"></div><div class="field"><label>END TIME</label><input id="end" type="datetime-local" value="${inputVal(v.endTime)}"></div><div class="quick">${!v.startTime?'<button class="btn secondary" id="startNow">Start now</button>':!v.endTime?'<button class="btn secondary" id="completeNow">Complete now</button>':'<button class="btn secondary" id="reopenNow">Reopen</button>'}${t?'<button class="btn secondary" id="copy">Copy title</button>':''}</div><label><input id="critical" type="checkbox" ${v.critical?'checked':''}> Critical</label>${t?'<p><button class="btn danger" id="delete">Delete task</button></p>':''}</div><div class="df"><button class="btn secondary" id="cancel">Cancel</button><button class="btn primary" id="save">Save</button></div></div></div>`;document.body.style.overflow='hidden';$('#title').focus();$('#x').onclick=$('#cancel').onclick=close;$('#startNow')&&($('#startNow').onclick=()=>{$('#start').value=inputVal(localISO());if($('#life').value==='Not started')$('#life').value='Ready'});$('#completeNow')&&($('#completeNow').onclick=()=>$('#end').value=inputVal(localISO()));$('#reopenNow')&&($('#reopenNow').onclick=()=>$('#end').value='');$('#copy')&&($('#copy').onclick=()=>copy(v.title));$('#save').onclick=async()=>{try{let life=$('#life').value,st=fromInput($('#start').value),en=fromInput($('#end').value);if(life==='Not started'){st=null;en=null}let o={id:t?.id||crypto.randomUUID(),title:$('#title').value,startTime:st,endTime:en,lifecycle:life,critical:$('#critical').checked};await save(o);close();toast('Saved')}catch(e){toast(e.message)}};$('#delete')&&($('#delete').onclick=async()=>{if(confirm('Permanently delete this task?')){await rawDelete(v.id);await refresh();mirror();close();toast('Deleted')}})}
async function act(id,a){let t=tasks.find(x=>x.id===id);if(!t)return;let v={...t};if(a==='start'){v.startTime=localISO();if(v.lifecycle==='Not started')v.lifecycle='Ready'}else if(a==='complete')v.endTime=localISO();else if(a==='reopen')v.endTime=null;else if(a==='resume'){if(t.lifecycle!=='Responded'||t.startTime===null||t.endTime!==null)return;v.lifecycle='Ready'}await save(v);toast(a==='resume'?'Active':a==='complete'?'Completed':a==='start'?'Started':'Reopened')}async function copy(s){try{await navigator.clipboard.writeText(s)}catch{let q=document.createElement('textarea');q.value=s;document.body.append(q);q.select();document.execCommand('copy');q.remove()}toast('Copied')}function taskMenu(t){let s=state(t),c=STATES[s],m=$('#menu');m.innerHTML=`<button data-a="copy">Copy title</button><button data-a="edit">Edit task</button><button data-a="${c.act}">${s==='responded'?'Return to active':c.label}</button><button data-a="archive">${t.lifecycle==='Archived'?'Restore to Ready':'Archive'}</button>`;m.classList.remove('hidden');m.querySelectorAll('button').forEach(b=>b.onclick=async()=>{m.classList.add('hidden');let a=b.dataset.a;if(a==='copy')copy(t.title);else if(a==='edit')editor(t);else if(a==='archive'){let v={...t,lifecycle:t.lifecycle==='Archived'?(t.startTime?'Ready':'Not started'):'Archived'};await save(v);toast(v.lifecycle)}else act(t.id,a)})}
$('#timeline').onclick=e=>{let r=e.target.closest('.row'),tog=e.target.closest('[data-toggle]');if(tog){let id=tog.dataset.toggle;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);render()}else if(r&&e.target.closest('[data-quick]'))act(r.dataset.id,e.target.closest('[data-quick]').dataset.quick);else if(r&&e.target.closest('[data-more]'))taskMenu(tasks.find(x=>x.id===r.dataset.id));else if(r&&e.target.closest('[data-edit]'))editor(tasks.find(x=>x.id===r.dataset.id))};$('#fab').onclick=$('#addTop').onclick=()=>editor();$('#menuBtn').onclick=()=>{let m=$('#menu');m.innerHTML=`<button data-m="collapse">Collapse past weeks</button><button data-m="expand">Expand all weeks</button><button data-m="archive">${archived?'Back to Timeline':'Archived tasks'}</button><button data-m="backup">Backup data</button><button data-m="restore">Restore data</button><button data-m="help">Help</button>`;m.classList.toggle('hidden');m.querySelectorAll('button').forEach(b=>b.onclick=()=>menu(b.dataset.m))};function menu(a){$('#menu').classList.add('hidden');if(a==='collapse'){tasks.filter(t=>t.startTime&&week(t.startTime)!==week(localISO())).forEach(t=>collapsed.add(week(t.startTime)));render()}else if(a==='expand'){collapsed.clear();render()}else if(a==='archive'){archived=!archived;render()}else if(a==='backup')backup();else if(a==='restore')$('#restore').click();else help()}
async function backup(){let p={application:'Started',formatVersion:1,databaseVersion:1,exportedAt:localISO(),taskCount:tasks.length,tasks},raw=JSON.stringify(p),h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));p.checksum=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));a.download='started-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup created')}$('#restore').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text()),sum=d.checksum;delete d.checksum;let h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(d))),calc=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');if(d.application!=='Started'||d.formatVersion!==1||sum!==calc||!Array.isArray(d.tasks))throw Error('Invalid Started backup');for(let t of d.tasks)if(valid(t).length)throw Error('Backup task validation failed');if(!confirm(`Replace current data with ${d.tasks.length} tasks?`))return;let tr=db.transaction(STORE,'readwrite'),s=tr.objectStore(STORE);s.clear();d.tasks.forEach(t=>s.put(t));await new Promise((r,j)=>{tr.oncomplete=r;tr.onerror=()=>j(tr.error)});await refresh();mirror();toast('Restore complete')}catch(x){toast(x.message)}e.target.value=''};function help(){$('#modal').innerHTML=`<div class="overlay"><div class="dialog"><div class="dh"><h2>HOW TO USE STARTED</h2><button class="icon" id="x">×</button></div><div class="db" style="font-size:13px;line-height:1.55"><p><b>Status icons:</b> ○ Not started · ▶ Active · Ⅱ Responded / waiting · ✓ Completed.</p><p><b>Responded:</b> A started task with lifecycle Responded shows the amber Pause icon and WAITING. Tap Pause to return to Ready/Active while preserving its original start time.</p><p><b>Timeline order:</b> Started tasks are always shown in the sequence they began, earliest to latest within each week. Status, lifecycle and Critical highlighting never change their position.</p><p><b>Start time:</b> The compact HH:mm time beside each task is when it originally started. Day separators make the weekly chronology easier to scan.</p><p><b>Status changes:</b> Responding, resuming, completing or reopening never resets the original start time.</p><p><b>Critical:</b> Pale-red highlighting is independent of task state and never changes Timeline order.</p><p><b>Copy title:</b> The task menu copies only the title.</p></div><div class="df"><button class="btn primary" id="cancel">Done</button></div></div></div>`;$('#x').onclick=$('#cancel').onclick=close}addEventListener('keydown',e=>{if(e.key==='Escape')close()});addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('#menuBtn')&&!e.target.closest('[data-more]'))$('#menu').classList.add('hidden')});(async()=>{try{db=await openDB();tasks=await all();bc='BroadcastChannel'in self?new BroadcastChannel(CH):null;if(bc)bc.onmessage=refresh;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js')}catch(e){let m=localStorage.getItem(MIRROR);if(m){tasks=JSON.parse(m).tasks||[];render();toast('Recovery mirror loaded')}else toast('Storage could not be opened')}})();
</script></body></html>
